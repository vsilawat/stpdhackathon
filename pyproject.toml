[project]
name = "machineplan"
version = "0.1.0"
description = "CNC machining process-plan prediction from B-Rep CAD (ASME-CIE 2026 Hackathon Problem 1)"
requires-python = ">=3.12"
dependencies = [
    "cadquery-ocp>=7.8",
    "numpy>=2.0",
    "scipy>=1.14",
    "scikit-learn>=1.9",
    "shapely>=2.0",
    "manifold3d>=3.0",
    "trimesh>=4.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.6", "pytest>=8.0", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/machineplan"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["validate_submission.py", "old"]   # organizers' file / inherited code

[tool.ruff.lint]
preview = true                                       # E3 rules are preview-only
extend-select = ["E3", "B", "I", "C4", "PIE", "PERF", "DTZ", "FAST"]
ignore = ["E301", "E302", "E303", "E305", "E402"]

[tool.mypy]
files = ["src", "tests"]
ignore_missing_imports = true   # OCP ships no stubs

[tool.pytest.ini_options]
testpaths = ["tests"]
